<!doctype html>
<html lang="id" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Asesmen SMP Negeri 36 Samarinda</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); }
        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.12); }
        .fade-in { animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
        .pulse-dot { animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
    </style>
  <style>body { box-sizing: border-box; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full">
  <div id="app" class="h-full w-full overflow-auto bg-gradient-to-br from-sky-50 via-blue-50 to-indigo-100" style="min-height:100%;">
   <!-- Header -->
   <header class="w-full bg-white/90 backdrop-blur-md shadow-sm border-b border-blue-100 sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
     <div class="flex items-center gap-3">
      <img src="https://iili.io/BxaPayB.png" alt="Logo" class="w-12 h-12 object-contain rounded-lg" loading="lazy" onerror="this.style.background='#3b82f6';this.alt='Logo';">
      <div>
       <h1 class="text-sm md:text-base font-bold text-gray-800" id="el-school-name">SMP NEGERI 36 SAMARINDA</h1>
       <p class="text-xs text-blue-600 font-semibold" id="el-portal-title">Asesmen Sumatif Akhir Semester</p>
      </div>
     </div><button onclick="showAdminPrompt()" class="flex items-center gap-1 px-3 py-1.5 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-600 text-xs font-medium transition"> <i data-lucide="shield" style="width:14px;height:14px;"></i> Admin </button>
    </div>
    <div class="max-w-5xl mx-auto px-4 pb-2">
     <p class="text-xs text-gray-500 font-medium" id="clock-display"></p>
    </div>
   </header><!-- Main Content -->
   <main class="max-w-5xl mx-auto px-4 py-6" id="main-content"></main><!-- Admin Password Modal -->
   <div id="admin-modal" class="fixed inset-0 z-[999] hidden items-center justify-center bg-black/40 backdrop-blur-sm" style="display:none;">
    <div class="bg-white rounded-2xl p-6 w-80 shadow-2xl fade-in">
     <h3 class="font-bold text-gray-800 mb-3">Akses Admin</h3><input type="password" id="admin-pass" placeholder="Masukkan password" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm mb-3 focus:outline-none focus:ring-2 focus:ring-blue-400">
     <p id="admin-error" class="text-red-500 text-xs mb-2 hidden">Password salah!</p>
     <div class="flex gap-2">
      <button onclick="checkAdmin()" class="flex-1 bg-blue-600 text-white text-sm font-semibold rounded-lg py-2 hover:bg-blue-700 transition">Masuk</button> <button onclick="hideAdminModal()" class="flex-1 bg-gray-100 text-gray-600 text-sm font-semibold rounded-lg py-2 hover:bg-gray-200 transition">Batal</button>
     </div>
    </div>
   </div><!-- Footer -->
   <footer class="w-full py-4 text-center text-xs text-gray-400 font-medium border-t border-blue-100 mt-8">
    © 2026 TIM ASESMEN SMP NEGERI 36 SAMARINDA
   </footer>
  </div>
  <script>
const ADMIN_PASS = '000000';
const WITA_OFFSET = 8;

const SCHEDULE = [
    { date: '2026-06-02', day: 'Selasa', subjects: ['Pendidikan Agama Islam', 'Pendidikan Agama Kristen', 'Bahasa Indonesia'] },
    { date: '2026-06-03', day: 'Rabu', subjects: ['PKn', 'IPS'] },
    { date: '2026-06-04', day: 'Kamis', subjects: ['IPA', 'Seni Budaya'] },
    { date: '2026-06-05', day: 'Jumat', subjects: ['Bahasa Inggris', 'PJOK'] },
    { date: '2026-06-08', day: 'Senin', subjects: ['Matematika', 'Informatika'] },
];

const LINKS_VIII = {
    'Pendidikan Agama Islam': ['https://forms.gle/9orZxvZ58vvrtmYy6'],
    'Pendidikan Agama Kristen': ['https://forms.gle/Qo7H9g4hvQugxmCi8'],
    'Bahasa Indonesia': ['https://forms.gle/6gxfVLqZKyFC7Eu6A|VIII A', 'https://forms.gle/MpvKvCtDcSt74pLM7|VIII B, C, D, E'],
    'PKn': ['https://forms.gle/M4AgxvXNUVAdxwSi6'],
    'IPS': ['https://forms.gle/ofvza4H4rwFqLAHt8'],
    'IPA': ['https://forms.gle/V5NgFnqi21D7QcYU9'],
    'Seni Budaya': ['https://forms.gle/dByxNgrV5Tfk49gu7'],
    'Bahasa Inggris': ['https://forms.gle/bp1XxugN5x3Do8MG6|VIII A, B', 'https://forms.gle/r9yefZSVbQzuTL8W9|VIII C, D, E'],
    'PJOK': ['https://forms.gle/e49giVqrqi34zRqN6'],
    'Matematika': ['https://forms.gle/3gqZ6UFArhQgk2L96'],
    'Informatika': ['https://forms.gle/LdkTD6yAuq18FSAw6'],
};

const LINKS_VII = {
    'Pendidikan Agama Islam': ['https://forms.gle/ViKHssntPvwBMz5q7'],
    'Pendidikan Agama Kristen': ['https://forms.gle/zZnSvMnYYd7BwX4C8'],
    'Bahasa Indonesia': ['https://forms.gle/V8GEvKybazKpjqMA9'],
    'PKn': ['https://forms.gle/AuHKp2PTkh2MtS69A'],
    'IPS': ['https://forms.gle/VsjT1hmNjtYLAbJj9'],
    'IPA': ['https://forms.gle/pp7omAUuYY2qrr4Q6'],
    'Seni Budaya': ['https://forms.gle/xhdiYRuy85KyriJD6'],
    'Bahasa Inggris': ['https://forms.gle/zjVgQW2XmXKD63pp7|VII A, B, C', 'https://forms.gle/YnfHFMghAVQg9v9JA|VII D, E'],
    'PJOK': ['https://forms.gle/U4GCxowvhthK5xGy7'],
    'Matematika': ['https://forms.gle/bCrKb9qXj9y8kR9C7'],
    'Informatika': ['https://forms.gle/u4jRfmggu9gnhKzZ8'],
};

let currentView = 'home';
let isAdmin = false;

function getWITA() {
    const now = new Date();
    const utc = now.getTime() + now.getTimezoneOffset() * 60000;
    return new Date(utc + WITA_OFFSET * 3600000);
}

function formatWITA(d) {
    const days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
    const months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    return `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()} - ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')} WITA`;
}

function updateClock() {
    document.getElementById('clock-display').textContent = formatWITA(getWITA());
}
setInterval(updateClock, 1000);
updateClock();

function getExamStart() { return new Date('2026-06-02T00:00:00+08:00'); }

function isExamPeriod() { return getWITA() >= getExamStart(); }

function getTodaySchedule() {
    const wita = getWITA();
    const dateStr = `${wita.getFullYear()}-${String(wita.getMonth()+1).padStart(2,'0')}-${String(wita.getDate()).padStart(2,'0')}`;
    return SCHEDULE.find(s => s.date === dateStr);
}

function isBeforeDeadline() {
    const wita = getWITA();
    return wita.getHours() < 12 || (wita.getHours() === 12 && wita.getMinutes() <= 15);
}

function renderHome() {
    currentView = 'home';
    const main = document.getElementById('main-content');
    main.innerHTML = `
        <div class="text-center mb-8 fade-in">
            <h2 class="text-2xl md:text-3xl font-extrabold text-gray-800 mb-2">Portal Asesmen Sumatif</h2>
            <p class="text-gray-500 text-sm">Pilih kelas untuk mengakses soal ujian</p>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-lg mx-auto fade-in">
            <button onclick="renderClass('VII')" class="card-hover glass rounded-2xl p-8 border border-blue-200 text-center group">
                <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-3 group-hover:bg-blue-200 transition">
                    <i data-lucide="book-open" style="width:28px;height:28px;color:#2563eb;"></i>
                </div>
                <h3 class="text-lg font-bold text-gray-800">KELAS VII</h3>
                <p class="text-xs text-gray-400 mt-1">Tap untuk masuk</p>
            </button>
            <button onclick="renderClass('VIII')" class="card-hover glass rounded-2xl p-8 border border-emerald-200 text-center group">
                <div class="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-3 group-hover:bg-emerald-200 transition">
                    <i data-lucide="book-open" style="width:28px;height:28px;color:#059669;"></i>
                </div>
                <h3 class="text-lg font-bold text-gray-800">KELAS VIII</h3>
                <p class="text-xs text-gray-400 mt-1">Tap untuk masuk</p>
            </button>
        </div>
    `;
    lucide.createIcons();
}

function renderClass(kelas) {
    currentView = kelas;
    const main = document.getElementById('main-content');
    const links = kelas === 'VII' ? LINKS_VII : LINKS_VIII;
    const simLink = kelas === 'VII' ? 'https://forms.gle/iamQFgSujKfTs1g58' : 'https://forms.gle/hB57g1PDSRpcK2UC6';
    const color = kelas === 'VII' ? 'blue' : 'emerald';

    let content = `
        <div class="fade-in">
            <button onclick="renderHome()" class="flex items-center gap-1 text-sm text-gray-500 hover:text-gray-800 mb-4 font-medium transition">
                <i data-lucide="arrow-left" style="width:16px;height:16px;"></i> Kembali
            </button>
            <h2 class="text-xl font-bold text-gray-800 mb-4">Kelas ${kelas}</h2>
    `;

    if (!isExamPeriod()) {
        content += `
            <div class="glass rounded-2xl p-6 border border-yellow-200 mb-4">
                <div class="flex items-center gap-2 mb-3">
                    <span class="pulse-dot w-2 h-2 rounded-full bg-yellow-500"></span>
                    <p class="text-sm font-semibold text-yellow-700">Ujian belum dimulai</p>
                </div>
                <p class="text-xs text-gray-500 mb-4">Ujian dimulai tanggal 2 Juni 2026. Silakan kerjakan soal simulasi terlebih dahulu.</p>
                <a href="${simLink}" class="inline-flex items-center gap-2 bg-yellow-500 hover:bg-yellow-600 text-white text-sm font-semibold px-4 py-2 rounded-lg transition">
                    <i data-lucide="file-text" style="width:16px;height:16px;"></i> Soal Simulasi Kelas ${kelas}
                </a>
            </div>
        `;
    } else {
        const today = getTodaySchedule();
        if (!today) {
            content += `<div class="glass rounded-2xl p-6 border border-gray-200"><p class="text-sm text-gray-500">Tidak ada jadwal ujian hari ini.</p></div>`;
        } else {
            const canAccess = isBeforeDeadline();
            content += `
                <div class="glass rounded-2xl p-5 border border-${color}-200 mb-2">
                    <div class="flex items-center gap-2 mb-3">
                        <span class="pulse-dot w-2 h-2 rounded-full bg-${color}-500"></span>
                        <p class="text-sm font-semibold text-gray-700">${today.day}, ${today.date.split('-').reverse().join('/')} ${canAccess ? '' : '<span class="text-red-500 text-xs ml-2">(Waktu habis - Batas 12:15 WITA)</span>'}</p>
                    </div>
                    <div class="space-y-2">
            `;
            today.subjects.forEach(subj => {
                const subjLinks = links[subj] || [];
                if (subjLinks.length === 1) {
                    const val = subjLinks[0];
                    if (val === 'Link Menyusul') {
                        content += `<div class="flex items-center justify-between bg-gray-50 rounded-lg px-4 py-3"><span class="text-sm font-medium text-gray-700">${subj}</span><span class="text-xs text-orange-500 font-medium">Link Menyusul</span></div>`;
                    } else {
                        const url = val.split('|')[0];
                        content += canAccess
                            ? `<a href="${url}" class="flex items-center justify-between bg-${color}-50 hover:bg-${color}-100 rounded-lg px-4 py-3 transition group"><span class="text-sm font-medium text-gray-700">${subj}</span><i data-lucide="external-link" style="width:14px;height:14px;color:#6b7280;" class="group-hover:text-${color}-600"></i></a>`
                            : `<div class="flex items-center justify-between bg-gray-50 rounded-lg px-4 py-3 opacity-50"><span class="text-sm font-medium text-gray-700">${subj}</span><i data-lucide="lock" style="width:14px;height:14px;color:#9ca3af;"></i></div>`;
                    }
                } else {
                    content += `<div class="bg-${color}-50 rounded-lg px-4 py-3"><p class="text-sm font-medium text-gray-700 mb-2">${subj}</p><div class="flex flex-wrap gap-2">`;
                    subjLinks.forEach(l => {
                        const [url, label] = l.split('|');
                        content += canAccess
                            ? `<a href="${url}" class="text-xs bg-white border border-${color}-200 hover:bg-${color}-100 rounded-md px-3 py-1.5 font-medium text-gray-600 transition">${label || subj}</a>`
                            : `<span class="text-xs bg-gray-100 border border-gray-200 rounded-md px-3 py-1.5 font-medium text-gray-400">${label || subj}</span>`;
                    });
                    content += `</div></div>`;
                }
            });
            content += `</div></div>`;
        }
    }
    content += `</div>`;
    main.innerHTML = content;
    lucide.createIcons();
}

function renderAdmin() {
    currentView = 'admin';
    const main = document.getElementById('main-content');
    let content = `<div class="fade-in">
        <button onclick="isAdmin=false;renderHome()" class="flex items-center gap-1 text-sm text-gray-500 hover:text-gray-800 mb-4 font-medium transition">
            <i data-lucide="arrow-left" style="width:16px;height:16px;"></i> Keluar Admin
        </button>
        <h2 class="text-xl font-bold text-gray-800 mb-1">Panel Admin</h2>
        <p class="text-xs text-gray-400 mb-5">Semua jadwal dan link ujian</p>
    `;

    ['VII','VIII'].forEach(kelas => {
        const links = kelas === 'VII' ? LINKS_VII : LINKS_VIII;
        const color = kelas === 'VII' ? 'blue' : 'emerald';
        content += `<h3 class="text-lg font-bold text-gray-700 mb-3 mt-6">Kelas ${kelas}</h3>`;
        SCHEDULE.forEach(day => {
            content += `<div class="glass rounded-xl p-4 border border-${color}-100 mb-3"><p class="text-sm font-bold text-gray-700 mb-2">${day.day}, ${day.date.split('-').reverse().join('/')}</p><div class="space-y-1.5">`;
            day.subjects.forEach(subj => {
                const subjLinks = links[subj] || [];
                if (subjLinks.length === 1) {
                    const val = subjLinks[0];
                    if (val === 'Link Menyusul') {
                        content += `<div class="flex items-center justify-between px-3 py-2 bg-gray-50 rounded-lg"><span class="text-xs font-medium text-gray-600">${subj}</span><span class="text-xs text-orange-500">Link Menyusul</span></div>`;
                    } else {
                        const url = val.split('|')[0];
                        content += `<a href="${url}" class="flex items-center justify-between px-3 py-2 bg-${color}-50 hover:bg-${color}-100 rounded-lg transition"><span class="text-xs font-medium text-gray-600">${subj}</span><i data-lucide="external-link" style="width:12px;height:12px;color:#6b7280;"></i></a>`;
                    }
                } else {
                    content += `<div class="px-3 py-2 bg-${color}-50 rounded-lg"><span class="text-xs font-medium text-gray-600">${subj}</span><div class="flex flex-wrap gap-1.5 mt-1">`;
                    subjLinks.forEach(l => {
                        const [url, label] = l.split('|');
                        content += `<a href="${url}" class="text-xs bg-white border border-${color}-200 hover:bg-${color}-100 rounded px-2 py-1 font-medium text-gray-600 transition">${label || subj}</a>`;
                    });
                    content += `</div></div>`;
                }
            });
            content += `</div></div>`;
        });
    });
    content += `</div>`;
    main.innerHTML = content;
    lucide.createIcons();
}

function showAdminPrompt() {
    const m = document.getElementById('admin-modal');
    m.style.display = 'flex';
    document.getElementById('admin-pass').value = '';
    document.getElementById('admin-error').classList.add('hidden');
}
function hideAdminModal() { document.getElementById('admin-modal').style.display = 'none'; }
function checkAdmin() {
    if (document.getElementById('admin-pass').value === ADMIN_PASS) {
        isAdmin = true;
        hideAdminModal();
        renderAdmin();
    } else {
        document.getElementById('admin-error').classList.remove('hidden');
    }
}
document.getElementById('admin-pass').addEventListener('keydown', e => { if(e.key==='Enter') checkAdmin(); });

// Init
const defaultConfig = { school_name: 'SMP NEGERI 36 SAMARINDA', portal_title: 'Asesmen Sumatif Akhir Semester', background_color: '#f0f9ff', surface_color: '#ffffff', text_color: '#1f2937', primary_action_color: '#2563eb', secondary_action_color: '#059669', font_family: 'Plus Jakarta Sans', font_size: 14 };

window.elementSdk.init({
    defaultConfig,
    onConfigChange: async (config) => {
        document.getElementById('el-school-name').textContent = config.school_name || defaultConfig.school_name;
        document.getElementById('el-portal-title').textContent = config.portal_title || defaultConfig.portal_title;
        const appEl = document.getElementById('app');
        appEl.style.background = `linear-gradient(135deg, ${config.background_color || defaultConfig.background_color}, #eef2ff)`;
        document.body.style.fontFamily = `${config.font_family || defaultConfig.font_family}, sans-serif`;
    },
    mapToCapabilities: (config) => ({
        recolorables: [
            { get: () => config.background_color || defaultConfig.background_color, set: (v) => { config.background_color = v; window.elementSdk.setConfig({ background_color: v }); } },
            { get: () => config.surface_color || defaultConfig.surface_color, set: (v) => { config.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); } },
            { get: () => config.text_color || defaultConfig.text_color, set: (v) => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); } },
            { get: () => config.primary_action_color || defaultConfig.primary_action_color, set: (v) => { config.primary_action_color = v; window.elementSdk.setConfig({ primary_action_color: v }); } },
            { get: () => config.secondary_action_color || defaultConfig.secondary_action_color, set: (v) => { config.secondary_action_color = v; window.elementSdk.setConfig({ secondary_action_color: v }); } },
        ],
        borderables: [],
        fontEditable: { get: () => config.font_family || defaultConfig.font_family, set: (v) => { config.font_family = v; window.elementSdk.setConfig({ font_family: v }); } },
        fontSizeable: { get: () => config.font_size || defaultConfig.font_size, set: (v) => { config.font_size = v; window.elementSdk.setConfig({ font_size: v }); } },
    }),
    mapToEditPanelValues: (config) => new Map([
        ['school_name', config.school_name || defaultConfig.school_name],
        ['portal_title', config.portal_title || defaultConfig.portal_title],
    ])
});

renderHome();
lucide.createIcons();
</script>
